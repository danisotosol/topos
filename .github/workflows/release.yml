# Release workflow: on every tag matching v*, build the native host for
# Linux (gnu) and Windows (msvc), package each with its installer and the
# extension, and publish both archives on a single GitHub Release.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    name: Build Linux artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native-host/target
          key: linux-cargo-${{ hashFiles('native-host/Cargo.lock') }}
          restore-keys: |
            linux-cargo-

      - name: Build native host
        working-directory: native-host
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGE="topos-linux-${TAG}"
          mkdir -p "${STAGE}/native-host"
          # install.sh rebuilds from source, so the crate itself must be in the
          # archive too, not just the prebuilt binary (kept below as a bonus
          # for anyone who wants to run it without waiting on cargo build).
          cp native-host/Cargo.toml native-host/Cargo.lock "${STAGE}/native-host/"
          cp -r native-host/src "${STAGE}/native-host/src"
          cp native-host/target/x86_64-unknown-linux-gnu/release/topos-host "${STAGE}/"
          cp install.sh README.md LICENSE "${STAGE}/"
          cp -r extension "${STAGE}/extension"
          tar -czf "${STAGE}.tar.gz" "${STAGE}"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: topos-linux
          path: topos-linux-*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows artifact
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native-host/target
          key: windows-cargo-${{ hashFiles('native-host/Cargo.lock') }}
          restore-keys: |
            windows-cargo-

      # MSVC is the rustup default on the Windows runner. OpenSSL is compiled
      # from source via the crate's vendored feature (Strawberry Perl is
      # preinstalled on windows-latest), so no external OpenSSL is required.
      - name: Build native host
        working-directory: native-host
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package zip
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $stage = "topos-windows-$tag"
          New-Item -ItemType Directory -Path (Join-Path $stage "native-host") | Out-Null
          # install.ps1 rebuilds from source, so the crate itself must be in
          # the archive too, not just the prebuilt binary (kept below as a
          # bonus for anyone who wants to run it without waiting on cargo build).
          Copy-Item native-host\Cargo.toml, native-host\Cargo.lock (Join-Path $stage "native-host")
          Copy-Item native-host\src (Join-Path $stage "native-host\src") -Recurse
          Copy-Item "native-host\target\x86_64-pc-windows-msvc\release\topos-host.exe" $stage
          Copy-Item native-host\install.ps1, README.md, LICENSE $stage
          Copy-Item extension (Join-Path $stage "extension") -Recurse
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: topos-windows
          path: topos-windows-*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    permissions:
      # Needed to create the release and upload its assets.
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release with both archives
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/topos-linux-*.tar.gz
            dist/topos-windows-*.zip
