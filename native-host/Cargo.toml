[package]
name = "topos"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "topos-host"
path = "src/main.rs"

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
axum        = "0.7"
reqwest     = { version = "0.12", features = ["stream"] }
url         = "2"
urlencoding = "2"
mdns-sd     = "0.11"
rust_cast   = "0.14"
byteorder   = "1.5"
log         = "0.4"
env_logger  = "0.11"
