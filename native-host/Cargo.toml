[package]
name = "topos"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "topos-host"
path = "src/main.rs"

[dependencies]
openssl     = "0.10"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
axum        = "0.7"
reqwest     = { version = "0.12", features = ["stream"] }
url         = "2"
urlencoding = "2"
mdns-sd     = "0.11"
rust_cast   = "0.14"
byteorder   = "1.5"
log         = "0.4"
env_logger  = "0.11"

# On Windows there is no system OpenSSL for openssl-sys to find (it would need
# vcpkg or a manual install), so build OpenSSL from source there. Scoped to
# cfg(windows) so the Linux build keeps linking the system OpenSSL as before.
# Cargo merges this with the plain `openssl` dependency above and unions the
# features only when compiling for a Windows target (feature resolver v2).
[target.'cfg(windows)'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
