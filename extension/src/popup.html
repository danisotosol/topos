<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=340, initial-scale=1" />
  <title>topos</title>
  <style>
    :root {
      --bg:            #0C0F14;
      --bg-elev:       #11151C;
      --surface:       #161B22;
      --surface-hover: #1B2129;

      --border:        rgba(255,255,255,0.07);
      --border-strong: rgba(255,255,255,0.14);

      --text:        #E8EBEE;
      --text-dim:    #8B95A1;
      --text-faint:  #5C6571;

      --mole:        #4A5D6E;
      --helmet:      #37444F;
      --band:        #9BA3AC;
      --accent:      #D87F8E;
      --accent-dim:  #A35E69;
      --ok:          #A3E635;
      --warn:        #F4B83C;

      --teal-fg:   #8FD9D5;
      --teal-bg:   rgba(143,217,213,0.12);
      --purple-fg: #C7B7FF;
      --purple-bg: rgba(199,183,255,0.12);

      --r-sm:   6px;
      --r-md:   10px;
      --r-lg:   14px;
      --r-pill: 999px;

      --font-sans: "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Text",
                   Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;

      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 340px;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button { font-family: inherit; cursor: pointer; }

    ::selection { background: rgba(216,127,142,0.33); color: #fff; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a313b; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a424d; }

    .header {
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-glyph { width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0; }
    .brand-wordmark { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: var(--text); }
    .brand-wordmark .dot { color: var(--accent); }

    .btn-rescan {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 5px 11px;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: border-color .15s, color .15s;
    }
    .btn-rescan:hover { border-color: var(--border-strong); color: var(--text); }
    .btn-rescan svg { width: 11px; height: 11px; }
    .btn-rescan.scanning svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .section { padding: 14px 16px 12px; }
    .section + .section { padding-top: 4px; }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-dim);
    }
    .section-head .count { color: var(--text-faint); font-variant-numeric: tabular-nums; }

    .list { display: flex; flex-direction: column; gap: 6px; }

    .stream {
      padding: 10px 12px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .stream-info { min-width: 0; flex: 1; }
    .stream-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--font-mono);
    }
    .stream-origin {
      font-size: 11px;
      color: var(--text-faint);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stream-meta { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }

    .chip {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: var(--r-pill);
    }
    .chip-hls  { color: var(--teal-fg);   background: var(--teal-bg); }
    .chip-dash { color: var(--purple-fg); background: var(--purple-bg); }

    .device {
      padding: 10px 12px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      text-align: left;
      color: inherit;
      transition: background .15s, border-color .15s;
    }
    .device:hover { background: var(--surface-hover); border-color: var(--border-strong); }
    .device.casting {
      background: rgba(216,127,142,0.10);
      border-color: rgba(216,127,142,0.38);
    }

    .device-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .device-icon {
      width: 28px; height: 28px;
      border-radius: var(--r-sm);
      background: rgba(255,255,255,0.05);
      color: var(--text-dim);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .device.casting .device-icon {
      background: rgba(216,127,142,0.20);
      color: var(--accent);
    }
    .device-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .device-kind { font-size: 11px; color: var(--text-faint); margin-top: 1px; }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px 3px 7px;
      border-radius: var(--r-pill);
      background: rgba(216,127,142,0.10);
      color: var(--accent);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .live-badge::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50%       { opacity: 1;    transform: scale(1.15); }
    }

    .empty {
      padding: 18px 12px;
      text-align: center;
      color: var(--text-faint);
      font-size: 12px;
      background: var(--bg-elev);
      border: 1px dashed var(--border);
      border-radius: var(--r-md);
    }
    .empty strong { color: var(--text-dim); font-weight: 500; display: block; margin-bottom: 4px; }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }
    .status { display: flex; align-items: center; gap: 6px; color: var(--text-dim); }
    .status-dot {
      width: 6px; height: 6px; border-radius: 999px;
      background: var(--ok);
      box-shadow: 0 0 6px rgba(163,230,53,0.40);
    }
    .status-dot.error { background: #ff6b6b; box-shadow: 0 0 6px rgba(255,107,107,0.40); }
    .status-dot.warn  { background: var(--warn); box-shadow: 0 0 6px rgba(244,184,60,0.40); }

    .version { color: var(--text-faint); font-family: var(--font-mono); font-size: 10.5px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <img class="brand-glyph" src="../icons/icon128.png" alt="" />
      <div class="brand-wordmark">topos<span class="dot">.</span></div>
    </div>
    <button class="btn-rescan" id="btn-rescan" title="Rescan network">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>
      </svg>
      rescan
    </button>
  </header>

  <section class="section">
    <div class="section-head">
      <span>Streams detected</span>
      <span class="count" id="stream-count">0</span>
    </div>
    <div class="list" id="stream-list"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <span>Devices on network</span>
      <span class="count" id="device-count">0</span>
    </div>
    <div class="list" id="device-list"></div>
  </section>

  <footer class="footer">
    <div class="status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">native host connected</span>
    </div>
    <span class="version">v0.1.0</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
